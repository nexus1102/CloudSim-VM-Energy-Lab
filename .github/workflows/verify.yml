name: Verify clean checkout
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_PROGRESS_BAR: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m venv 平台/.venv
          & ./平台/.venv/Scripts/python.exe -m pip install -r 平台/requirements-lock.txt
      - name: Portable acceptance
        shell: powershell
        run: |
          $env:RESEARCH_JAVA_HOME = $env:JAVA_HOME
          $env:RESEARCH_PYTHON = (Resolve-Path ./平台/.venv/Scripts/python.exe).Path
          powershell -ExecutionPolicy Bypass -File 平台/tests/verify-clean.ps1
